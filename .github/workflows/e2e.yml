name: E2E

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  wdio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CI: 'true'
